<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Spotlight: amidships.dev, a portfolio you sail. A chart of islands joined by a dotted course.">
  <style>
    .course { animation: march 2.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -24; } }
    .boat { animation: bob 4.5s ease-in-out infinite; transform-origin: 640px 200px; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(3px) rotate(3deg); } }
    .lamp { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .4; } }
    .ripple { animation: drift 8s linear infinite; }
    @keyframes drift { to { transform: translateX(48px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030d15"/><stop offset=".45" stop-color="#061722"/><stop offset="1" stop-color="#0e3a52"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="chartfade"><rect x="540" width="660" height="260" fill="url(#fade)"/></mask>
    <radialGradient id="lampglow"><stop offset="0" stop-color="#f3b04a" stop-opacity=".9"/><stop offset="1" stop-color="#f3b04a" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="260" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="url(#bg)"/>
