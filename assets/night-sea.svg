<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Jacob Knight: software engineer in London. A night sea with a sailing boat and a lighthouse.">
  <style>
    .tw { animation: tw 4s ease-in-out infinite; }
    .t1 { animation-delay: -1s; } .t2 { animation-delay: -2s; animation-duration: 5s; } .t3 { animation-delay: -3s; animation-duration: 3s; }
    @keyframes tw { 0%, 100% { opacity: .9; } 50% { opacity: .15; } }
    .w1 { animation: drift 14s linear infinite; }
    .w2 { animation: drift 9s linear infinite reverse; }
    .w3 { animation: drift 6s linear infinite; }
    @keyframes drift { to { transform: translateX(240px); } }
    .boat { animation: bob 5s ease-in-out infinite; transform-origin: 600px 236px; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2.5deg); } 50% { transform: translateY(5px) rotate(2.5deg); } }
    .beam { animation: sweep 6s ease-in-out infinite; transform-origin: 1076px 112px; }
    @keyframes sweep { 0%, 100% { transform: scaleX(1); opacity: .5; } 45%, 55% { transform: scaleX(-1); opacity: .5; } 25%, 75% { transform: scaleX(0.05); opacity: .1; } }
    .lamp { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .55; } }
    .sh { animation: glint 3s ease-in-out infinite; }
    .s1 { animation-delay: -1s; } .s2 { animation-delay: -2s; }
    @keyframes glint { 0%, 100% { opacity: .55; } 50% { opacity: .12; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030d15"/><stop offset=".6" stop-color="#061722"/><stop offset="1" stop-color="#0f3b4f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e3a52"/><stop offset="1" stop-color="#061722"/>
    </linearGradient>
    <radialGradient id="moonglow"><stop offset="0" stop-color="#ffc96e" stop-opacity=".35"/><stop offset="1" stop-color="#ffc96e" stop-opacity="0"/></radialGradient>
    <radialGradient id="lampglow"><stop offset="0" stop-color="#f3b04a" stop-opacity=".9"/><stop offset="1" stop-color="#f3b04a" stop-opacity="0"/></radialGradient>
    <linearGradient id="beamfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc96e" stop-opacity=".0"/><stop offset="1" stop-color="#ffc96e" stop-opacity=".9"/>
    </linearGradient>
    <mask id="crescent"><rect width="1200" height="320" fill="#fff"/><circle cx="870" cy="68" r="20" fill="#000"/></mask>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#sky)"/>
    <circle cx="396" cy="37" r="0.8" fill="#d8efe6" opacity="0.39" class="tw t0"/><circle cx="642" cy="70" r="0.8" fill="#d8efe6" opacity="0.80"/><circle cx="269" cy="27" r="1.2" fill="#d8efe6" opacity="0.38"/><circle cx="979" cy="33" r="1" fill="#d8efe6" opacity="0.67"/><circle cx="696" cy="23" r="1.6" fill="#d8efe6" opacity="0.55"/><circle cx="1152" cy="21" r="1" fill="#d8efe6" opacity="0.49" class="tw t2"/><circle cx="187" cy="32" r="1" fill="#d8efe6" opacity="0.63"/><circle cx="811" cy="30" r="1.6" fill="#d8efe6" opacity="0.67"/><circle cx="93" cy="23" r="1" fill="#d8efe6" opacity="0.60"/><circle cx="439" cy="52" r="1" fill="#d8efe6" opacity="0.70"/><circle cx="866" cy="58" r="0.8" fill="#d8efe6" opacity="0.41"/><circle cx="907" cy="101" r="1" fill="#d8efe6" opacity="0.52"/><circle cx="944" cy="24" r="0.8" fill="#d8efe6" opacity="0.82"/><circle cx="771" cy="165" r="1.2" fill="#d8efe6" opacity="0.49"/><circle cx="215" cy="32" r="0.8" fill="#d8efe6" opacity="0.46"/><circle cx="596" cy="39" r="1.2" fill="#d8efe6" opacity="0.62"/><circle cx="1045" cy="139" r="1.6" fill="#d8efe6" opacity="0.49"/><circle cx="1046" cy="160" r="1" fill="#d8efe6" opacity="0.39"/><circle cx="34" cy="140" r="1" fill="#d8efe6" opacity="0.48" class="tw t0"/><circle cx="25" cy="78" r="1" fill="#d8efe6" opacity="0.65"/><circle cx="390" cy="33" r="1.6" fill="#d8efe6" opacity="0.83"/><circle cx="780" cy="126" r="1.2" fill="#d8efe6" opacity="0.80" class="tw t3"/><circle cx="925" cy="147" r="1.6" fill="#d8efe6" opacity="0.55"/><circle cx="483" cy="30" r="1.2" fill="#d8efe6" opacity="0.38"/><circle cx="98" cy="46" r="1" fill="#d8efe6" opacity="0.40" class="tw t2"/><circle cx="717" cy="30" r="1.6" fill="#d8efe6" opacity="0.43"/>
    <circle cx="860" cy="74" r="70" fill="url(#moonglow)"/>
    <circle cx="860" cy="74" r="22" fill="#ffc96e" mask="url(#crescent)"/>

    <polygon class="beam" points="1076,112 700,86 700,138" fill="url(#beamfade)" opacity=".5"/>

    <path class="w1" d="M-480,232 Q-420.0,227 -360.0,232 Q-300.0,237 -240.0,232 Q-180.0,227 -120.0,232 Q-60.0,237 0.0,232 Q60.0,227 120.0,232 Q180.0,237 240.0,232 Q300.0,227 360.0,232 Q420.0,237 480.0,232 Q540.0,227 600.0,232 Q660.0,237 720.0,232 Q780.0,227 840.0,232 Q900.0,237 960.0,232 Q1020.0,227 1080.0,232 Q1140.0,237 1200.0,232 Q1260.0,227 1320.0,232 Q1380.0,237 1440.0,232 Q1500.0,227 1560.0,232 Q1620.0,237 1680.0,232 L1680,320 L-480,320 Z" fill="#0f3b4f"/>
    <!-- lighthouse on its rock -->
    <path d="M1020,242 Q1030,214 1060,210 Q1100,206 1124,224 Q1140,236 1146,242 Z" fill="#03080c"/>
    <polygon points="1062,210 1066,124 1086,124 1090,210" fill="#d8efe6"/>
    <polygon points="1064.4,180 1065.4,158 1086.6,158 1087.6,180" fill="#a8243a"/>
    <polygon points="1063.2,206 1063.9,190 1088.1,190 1088.8,206" fill="#a8243a"/>
    <rect x="1062" y="122" width="28" height="4" fill="#03080c"/>
    <circle class="lamp" cx="1076" cy="112" r="34" fill="url(#lampglow)"/>
    <rect x="1068" y="104" width="16" height="18" rx="2" fill="#ffc96e"/>
    <path d="M1064,104 L1076,92 L1088,104 Z" fill="#03080c"/>
    <rect x="1075" y="86" width="2" height="7" fill="#03080c"/>

    <rect x="0" y="236" width="1200" height="84" fill="url(#sea)"/>
    <rect class="sh s0" x="827" y="246" width="70" height="1.6" rx="0.8" fill="#ffc96e"/><rect class="sh s1" x="822" y="255" width="62" height="1.6" rx="0.8" fill="#ffc96e"/><rect class="sh s2" x="828" y="264" width="54" height="1.6" rx="0.8" fill="#ffc96e"/><rect class="sh s0" x="834" y="273" width="46" height="1.6" rx="0.8" fill="#ffc96e"/><rect class="sh s1" x="838" y="282" width="38" height="1.6" rx="0.8" fill="#ffc96e"/><rect class="sh s2" x="837" y="291" width="30" height="1.6" rx="0.8" fill="#ffc96e"/><rect class="sh s0" x="856" y="300" width="22" height="1.6" rx="0.8" fill="#ffc96e"/>

    <g class="boat">
      <line x1="600" y1="162" x2="600" y2="230" stroke="#03080c" stroke-width="3"/>
      <path d="M603,166 Q640,196 636,224 L603,224 Z" fill="#a8243a" stroke="#03080c" stroke-width="2" stroke-linejoin="round"/>
      <path d="M597,178 Q574,202 576,224 L597,224 Z" fill="#d8efe6" stroke="#03080c" stroke-width="2" stroke-linejoin="round"/>
      <path d="M556,228 L646,228 Q640,246 620,248 L578,248 Q562,244 556,228 Z" fill="#4a2e1c" stroke="#03080c" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="556" y="227" width="90" height="4" fill="#6e4a2c"/>
      <circle cx="640" cy="220" r="9" fill="url(#lampglow)"/>
      <circle cx="640" cy="220" r="2.5" fill="#ffc96e"/>
    </g>

    <path class="w2" d="M-480,246 Q-440.0,242 -400.0,246 Q-360.0,250 -320.0,246 Q-280.0,242 -240.0,246 Q-200.0,250 -160.0,246 Q-120.0,242 -80.0,246 Q-40.0,250 0.0,246 Q40.0,242 80.0,246 Q120.0,250 160.0,246 Q200.0,242 240.0,246 Q280.0,250 320.0,246 Q360.0,242 400.0,246 Q440.0,250 480.0,246 Q520.0,242 560.0,246 Q600.0,250 640.0,246 Q680.0,242 720.0,246 Q760.0,250 800.0,246 Q840.0,242 880.0,246 Q920.0,250 960.0,246 Q1000.0,242 1040.0,246 Q1080.0,250 1120.0,246 Q1160.0,242 1200.0,246 Q1240.0,250 1280.0,246 Q1320.0,242 1360.0,246 Q1400.0,250 1440.0,246 Q1480.0,242 1520.0,246 Q1560.0,250 1600.0,246 Q1640.0,242 1680.0,246 L1680,320 L-480,320 Z" fill="#0e3a52" opacity=".85"/>
    <path class="w3" d="M-480,270 Q-450.0,267 -420.0,270 Q-390.0,273 -360.0,270 Q-330.0,267 -300.0,270 Q-270.0,273 -240.0,270 Q-210.0,267 -180.0,270 Q-150.0,273 -120.0,270 Q-90.0,267 -60.0,270 Q-30.0,273 0.0,270 Q30.0,267 60.0,270 Q90.0,273 120.0,270 Q150.0,267 180.0,270 Q210.0,273 240.0,270 Q270.0,267 300.0,270 Q330.0,273 360.0,270 Q390.0,267 420.0,270 Q450.0,273 480.0,270 Q510.0,267 540.0,270 Q570.0,273 600.0,270 Q630.0,267 660.0,270 Q690.0,273 720.0,270 Q750.0,267 780.0,270 Q810.0,273 840.0,270 Q870.0,267 900.0,270 Q930.0,273 960.0,270 Q990.0,267 1020.0,270 Q1050.0,273 1080.0,270 Q1110.0,267 1140.0,270 Q1170.0,273 1200.0,270 Q1230.0,267 1260.0,270 Q1290.0,273 1320.0,270 Q1350.0,267 1380.0,270 Q1410.0,273 1440.0,270 Q1470.0,267 1500.0,270 Q1530.0,273 1560.0,270 Q1590.0,267 1620.0,270 Q1650.0,273 1680.0,270 L1680,320 L-480,320 Z" fill="#061722" opacity=".9"/>

    <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
      <text x="64" y="112" fill="#d8efe6" font-size="58" letter-spacing="1">Jacob Knight</text>
      <text x="66" y="148" fill="#f3b04a" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="4">SOFTWARE ENGINEER  ·  LONDON</text>
      <text x="66" y="184" fill="#d8efe6" fill-opacity=".72" font-size="19" font-style="italic">Finally... building for fun.</text>
    </g>
  </g>
</svg>
